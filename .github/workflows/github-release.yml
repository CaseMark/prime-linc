name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v0.7.1)'
        required: true
        type: string

permissions: {}

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate release tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require trusted dispatch ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "Manual releases must dispatch the workflow from main, not ${GITHUB_REF}." >&2
            exit 1
          }

      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify immutable release source
        run: |
          VERSION="$(node -p "require('./packages/coding-agent/package.json').version")"
          test "${RELEASE_TAG}" = "v${VERSION}" || {
            echo "Release tag ${RELEASE_TAG} does not match package version v${VERSION}." >&2
            exit 1
          }
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          test "${HEAD_COMMIT}" = "${TAG_COMMIT}" || {
            echo "Checked-out source ${HEAD_COMMIT} is not ${RELEASE_TAG} (${TAG_COMMIT})." >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${HEAD_COMMIT}" origin/main || {
            echo "Release tag ${RELEASE_TAG} is not on reviewed main history." >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build committed source
        run: npm run build

      - name: Check
        run: npm run check

      - name: Install uv for kernel tests
        run: |
          python3 -m pip install --user uv
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Test
        run: npm test

      - name: Verify build did not mutate source
        run: git diff --exit-code

      - name: Pack and smoke-test release
        run: |
          rm -rf release-artifact
          node scripts/publish.mjs --pack release-artifact/prime-linc.tgz
          cd release-artifact
          NAME="$(tar -xOf prime-linc.tgz package/package.json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).name))')"
          VERSION="$(tar -xOf prime-linc.tgz package/package.json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SHA256="$(sha256sum prime-linc.tgz | cut -d ' ' -f 1)"
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary prime-linc.tgz | openssl base64 -A)"
          BYTES="$(stat -c '%s' prime-linc.tgz)"
          NAME="${NAME}" VERSION="${VERSION}" SOURCE_COMMIT="${SOURCE_COMMIT}" \
            SHA256="${SHA256}" INTEGRITY="${INTEGRITY}" BYTES="${BYTES}" node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const metadata = {
            schemaVersion: 1,
            name: process.env.NAME,
            version: process.env.VERSION,
            tag: process.env.RELEASE_TAG,
            sourceCommit: process.env.SOURCE_COMMIT,
            asset: {
              name: "prime-linc.tgz",
              bytes: Number(process.env.BYTES),
              sha256: process.env.SHA256,
              integrity: process.env.INTEGRITY,
            },
          };
          writeFileSync("release.json", `${JSON.stringify(metadata, null, 2)}\n`);
          NODE
          sha256sum prime-linc.tgz release.json > SHA256SUMS

      - name: Upload validated tarball
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prime-linc-${{ env.RELEASE_TAG }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish immutable GitHub release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download validated tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: release-artifact

      - name: Verify artifact and package metadata
        run: |
          cd release-artifact
          sha256sum -c SHA256SUMS
          tar -xOf prime-linc.tgz package/package.json > "${RUNNER_TEMP}/prime-linc-package.json"
          NAME="$(PACKAGE_JSON="${RUNNER_TEMP}/prime-linc-package.json" node -e 'process.stdout.write(require(process.env.PACKAGE_JSON).name)')"
          VERSION="$(PACKAGE_JSON="${RUNNER_TEMP}/prime-linc-package.json" node -e 'process.stdout.write(require(process.env.PACKAGE_JSON).version)')"
          test "${NAME}" = "@casemark/prime-linc" || {
            echo "Unexpected package name: ${NAME}" >&2
            exit 1
          }
          test "${RELEASE_TAG}" = "v${VERSION}" || {
            echo "Artifact version ${VERSION} does not match ${RELEASE_TAG}." >&2
            exit 1
          }
          METADATA_NAME="$(node -p "require('./release.json').name")"
          METADATA_VERSION="$(node -p "require('./release.json').version")"
          METADATA_TAG="$(node -p "require('./release.json').tag")"
          METADATA_SHA256="$(node -p "require('./release.json').asset.sha256")"
          METADATA_INTEGRITY="$(node -p "require('./release.json').asset.integrity")"
          METADATA_BYTES="$(node -p "require('./release.json').asset.bytes")"
          ACTUAL_SHA256="$(sha256sum prime-linc.tgz | cut -d ' ' -f 1)"
          ACTUAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary prime-linc.tgz | openssl base64 -A)"
          ACTUAL_BYTES="$(stat -c '%s' prime-linc.tgz)"
          test "${METADATA_NAME}" = "${NAME}"
          test "${METADATA_VERSION}" = "${VERSION}"
          test "${METADATA_TAG}" = "${RELEASE_TAG}"
          test "${METADATA_SHA256}" = "${ACTUAL_SHA256}"
          test "${METADATA_INTEGRITY}" = "${ACTUAL_INTEGRITY}"
          test "${METADATA_BYTES}" = "${ACTUAL_BYTES}"

      - name: Verify remote tag still matches validated source
        run: |
          set -euo pipefail
          EXPECTED_COMMIT="$(node -p "require('./release-artifact/release.json').sourceCommit")"
          OBJECT_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.type)"
          OBJECT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          for _ in $(seq 1 5); do
            if [ "${OBJECT_TYPE}" = commit ]; then
              break
            fi
            test "${OBJECT_TYPE}" = tag || {
              echo "Unexpected ${RELEASE_TAG} object type ${OBJECT_TYPE}." >&2
              exit 1
            }
            OBJECT_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJECT_SHA}" --jq .object.type)"
            OBJECT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${OBJECT_SHA}" --jq .object.sha)"
          done
          test "${OBJECT_TYPE}" = commit
          test "${OBJECT_SHA}" = "${EXPECTED_COMMIT}" || {
            echo "${RELEASE_TAG} moved from validated ${EXPECTED_COMMIT} to ${OBJECT_SHA}." >&2
            exit 1
          }

      - name: Create or recover draft release
        run: |
          set -euo pipefail
          ASSETS=(release-artifact/prime-linc.tgz release-artifact/release.json release-artifact/SHA256SUMS)
          RELEASE_KIND=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            RELEASE_KIND+=(--prerelease)
          fi
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" "${ASSETS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "prime-linc ${RELEASE_TAG}" \
              "${RELEASE_KIND[@]}"
          fi

          IS_DRAFT="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
          REMOTE_DIR="$(mktemp -d)"
          trap 'rm -rf "${REMOTE_DIR}"' EXIT

          for ASSET in prime-linc.tgz release.json SHA256SUMS; do
            if gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET}" --dir "${REMOTE_DIR}"; then
              cmp "release-artifact/${ASSET}" "${REMOTE_DIR}/${ASSET}" || {
                echo "Existing ${RELEASE_TAG} asset ${ASSET} has different bytes." >&2
                exit 1
              }
            else
              test "${IS_DRAFT}" = true || {
                echo "Published ${RELEASE_TAG} is missing immutable asset ${ASSET}." >&2
                exit 1
              }
              gh release upload "${RELEASE_TAG}" "release-artifact/${ASSET}" --repo "${GITHUB_REPOSITORY}"
            fi
          done

          if [ "${IS_DRAFT}" = true ]; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          fi

      - name: Verify immutable release attestation
        run: |
          set -euo pipefail
          VERIFIED=false
          for _ in $(seq 1 12); do
            if gh release verify "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"; then
              VERIFIED=true
              break
            fi
            sleep 5
          done
          test "${VERIFIED}" = true || {
            echo "GitHub did not return the immutable release attestation in time." >&2
            exit 1
          }

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${VERIFY_DIR}"
          cmp release-artifact/prime-linc.tgz "${VERIFY_DIR}/prime-linc.tgz"
          cmp release-artifact/release.json "${VERIFY_DIR}/release.json"
          cmp release-artifact/SHA256SUMS "${VERIFY_DIR}/SHA256SUMS"
          gh release verify-asset "${RELEASE_TAG}" release-artifact/prime-linc.tgz --repo "${GITHUB_REPOSITORY}"
