name: GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v0.7.1)'
        required: true
        type: string

permissions: {}

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate release tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require trusted dispatch ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "Manual releases must dispatch the workflow from main, not ${GITHUB_REF}." >&2
            exit 1
          }

      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify immutable release source
        run: |
          VERSION="$(node -p "require('./packages/coding-agent/package.json').version")"
          test "${RELEASE_TAG}" = "v${VERSION}" || {
            echo "Release tag ${RELEASE_TAG} does not match package version v${VERSION}." >&2
            exit 1
          }
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          test "${HEAD_COMMIT}" = "${TAG_COMMIT}" || {
            echo "Checked-out source ${HEAD_COMMIT} is not ${RELEASE_TAG} (${TAG_COMMIT})." >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${HEAD_COMMIT}" origin/main || {
            echo "Release tag ${RELEASE_TAG} is not on reviewed main history." >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build committed source
        run: npm run build

      - name: Check
        run: npm run check

      - name: Install uv for kernel tests
        run: |
          python3 -m pip install --user uv
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Test
        run: npm test

      - name: Verify build did not mutate source
        run: git diff --exit-code

      - name: Pack and smoke-test release
        run: |
          rm -rf release-artifact
          node scripts/publish.mjs --pack release-artifact/prime-linc.tgz
          cd release-artifact
          sha256sum prime-linc.tgz > SHA256SUMS

      - name: Upload validated tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prime-linc-${{ env.RELEASE_TAG }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish immutable GitHub release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download validated tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prime-linc-${{ env.RELEASE_TAG }}
          path: release-artifact

      - name: Verify artifact and package metadata
        run: |
          cd release-artifact
          sha256sum -c SHA256SUMS
          tar -xOf prime-linc.tgz package/package.json > "${RUNNER_TEMP}/prime-linc-package.json"
          NAME="$(PACKAGE_JSON="${RUNNER_TEMP}/prime-linc-package.json" node -e 'process.stdout.write(require(process.env.PACKAGE_JSON).name)')"
          VERSION="$(PACKAGE_JSON="${RUNNER_TEMP}/prime-linc-package.json" node -e 'process.stdout.write(require(process.env.PACKAGE_JSON).version)')"
          test "${NAME}" = "@casemark/prime-linc" || {
            echo "Unexpected package name: ${NAME}" >&2
            exit 1
          }
          test "${RELEASE_TAG}" = "v${VERSION}" || {
            echo "Artifact version ${VERSION} does not match ${RELEASE_TAG}." >&2
            exit 1
          }

      - name: Create or recover draft release
        run: |
          set -euo pipefail
          ASSETS=(release-artifact/prime-linc.tgz release-artifact/SHA256SUMS)
          RELEASE_KIND=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            RELEASE_KIND+=(--prerelease)
          fi
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" "${ASSETS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "prime-linc ${RELEASE_TAG}" \
              "${RELEASE_KIND[@]}"
          fi

          IS_DRAFT="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
          REMOTE_DIR="$(mktemp -d)"
          trap 'rm -rf "${REMOTE_DIR}"' EXIT

          for ASSET in prime-linc.tgz SHA256SUMS; do
            if gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${ASSET}" --dir "${REMOTE_DIR}"; then
              cmp "release-artifact/${ASSET}" "${REMOTE_DIR}/${ASSET}" || {
                echo "Existing ${RELEASE_TAG} asset ${ASSET} has different bytes." >&2
                exit 1
              }
            else
              test "${IS_DRAFT}" = true || {
                echo "Published ${RELEASE_TAG} is missing immutable asset ${ASSET}." >&2
                exit 1
              }
              gh release upload "${RELEASE_TAG}" "release-artifact/${ASSET}" --repo "${GITHUB_REPOSITORY}"
            fi
          done

          if [ "${IS_DRAFT}" = true ]; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
          fi

      - name: Verify immutable release attestation
        run: |
          set -euo pipefail
          VERIFIED=false
          for _ in $(seq 1 12); do
            if gh release verify "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"; then
              VERIFIED=true
              break
            fi
            sleep 5
          done
          test "${VERIFIED}" = true || {
            echo "GitHub did not return the immutable release attestation in time." >&2
            exit 1
          }

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${VERIFY_DIR}"
          cmp release-artifact/prime-linc.tgz "${VERIFY_DIR}/prime-linc.tgz"
          cmp release-artifact/SHA256SUMS "${VERIFY_DIR}/SHA256SUMS"
