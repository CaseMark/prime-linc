name: npm Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (for example v0.7.1)'
        required: true
        type: string

permissions: {}

concurrency:
  # Dist-tags are shared mutable state: serialize every package release, not
  # merely retries of the same version.
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Build and validate tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require trusted dispatch ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "Manual publishing must dispatch the workflow from main, not ${GITHUB_REF}." >&2
            exit 1
          }

      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify immutable release source
        run: |
          VERSION="$(node -p "require('./packages/coding-agent/package.json').version")"
          test "${RELEASE_TAG}" = "v${VERSION}" || {
            echo "Release tag ${RELEASE_TAG} does not match package version v${VERSION}." >&2
            exit 1
          }
          TAG_COMMIT="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          test "${HEAD_COMMIT}" = "${TAG_COMMIT}" || {
            echo "Checked-out source ${HEAD_COMMIT} is not ${RELEASE_TAG} (${TAG_COMMIT})." >&2
            exit 1
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${HEAD_COMMIT}" origin/main || {
            echo "Release tag ${RELEASE_TAG} is not on reviewed main history." >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build committed source
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify build did not mutate source
        run: git diff --exit-code

      - name: Pack and smoke-test release
        run: |
          rm -rf release-artifact
          node scripts/publish.mjs --pack release-artifact/prime-linc.tgz
          cd release-artifact
          sha256sum prime-linc.tgz > SHA256SUMS

      - name: Upload validated tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prime-linc-${{ env.RELEASE_TAG }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish validated tarball
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      actions: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download validated tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prime-linc-${{ env.RELEASE_TAG }}
          path: release-artifact

      - name: Verify artifact and package metadata
        id: package
        run: |
          cd release-artifact
          sha256sum -c SHA256SUMS
          tar -xOf prime-linc.tgz package/package.json > "${RUNNER_TEMP}/prime-linc-package.json"
          NAME="$(PACKAGE_JSON="${RUNNER_TEMP}/prime-linc-package.json" node -e 'process.stdout.write(require(process.env.PACKAGE_JSON).name)')"
          VERSION="$(PACKAGE_JSON="${RUNNER_TEMP}/prime-linc-package.json" node -e 'process.stdout.write(require(process.env.PACKAGE_JSON).version)')"
          test "${NAME}" = "@casemark/prime-linc" || {
            echo "Unexpected package name: ${NAME}" >&2
            exit 1
          }
          test "${RELEASE_TAG}" = "v${VERSION}" || {
            echo "Artifact version ${VERSION} does not match ${RELEASE_TAG}." >&2
            exit 1
          }
          DIST_TAG="$(VERSION="${VERSION}" node <<'NODE'
          const version = process.env.VERSION;
          const match = /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z.-]+)?$/.exec(version);
          if (!match) throw new Error(`Invalid semver: ${version}`);
          if (!match[1]) {
            process.stdout.write("latest");
          } else {
            const label = match[1].split(".")[0].toLowerCase();
            if (!/^[a-z][a-z0-9-]*$/.test(label)) {
              throw new Error(`Prerelease ${version} needs an alphabetic dist-tag label`);
            }
            process.stdout.write(label);
          }
          NODE
          )"
          INTEGRITY="sha512-$(openssl dgst -sha512 -binary prime-linc.tgz | openssl base64 -A)"
          {
            echo "name=${NAME}"
            echo "version=${VERSION}"
            echo "dist_tag=${DIST_TAG}"
            echo "integrity=${INTEGRITY}"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install trusted-publishing npm version
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm --version

      - name: Publish once and verify registry integrity
        env:
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          DIST_TAG: ${{ steps.package.outputs.dist_tag }}
          LOCAL_INTEGRITY: ${{ steps.package.outputs.integrity }}
        run: |
          set -euo pipefail
          TARBALL="release-artifact/prime-linc.tgz"

          set +e
          EXISTING="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version dist.integrity --json 2>&1)"
          VIEW_STATUS=$?
          set -e
          if [ "${VIEW_STATUS}" -eq 0 ]; then
            REGISTRY_INTEGRITY="$(REGISTRY_JSON="${EXISTING}" node -e 'const v=JSON.parse(process.env.REGISTRY_JSON); process.stdout.write(v["dist.integrity"] || "")')"
            test "${REGISTRY_INTEGRITY}" = "${LOCAL_INTEGRITY}" || {
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already exists with different bytes." >&2
              exit 1
            }
            TAGGED_VERSION="$(npm view "${PACKAGE_NAME}" "dist-tags.${DIST_TAG}" --json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)))')"
            test "${TAGGED_VERSION}" = "${PACKAGE_VERSION}" || {
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} exists, but ${DIST_TAG} points to ${TAGGED_VERSION}." >&2
              exit 1
            }
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published with matching integrity and dist-tag."
            exit 0
          fi
          echo "${EXISTING}" | grep -Eq 'E404|404 Not Found' || {
            echo "Registry lookup failed: ${EXISTING}" >&2
            exit 1
          }

          if [ -n "${BOOTSTRAP_NPM_TOKEN}" ]; then
            NPMRC="${RUNNER_TEMP}/npmrc"
            printf '//registry.npmjs.org/:_authToken=%s\n' "${BOOTSTRAP_NPM_TOKEN}" > "${NPMRC}"
            export NPM_CONFIG_USERCONFIG="${NPMRC}"
          else
            unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          fi

          npm publish "${TARBALL}" --access public --provenance --ignore-scripts --tag "${DIST_TAG}"
          unset BOOTSTRAP_NPM_TOKEN NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG

          VERIFIED=false
          for _ in $(seq 1 12); do
            set +e
            METADATA="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version dist.integrity --json 2>/dev/null)"
            STATUS=$?
            set -e
            if [ "${STATUS}" -eq 0 ]; then
              REGISTRY_INTEGRITY="$(REGISTRY_JSON="${METADATA}" node -e 'const v=JSON.parse(process.env.REGISTRY_JSON); process.stdout.write(v["dist.integrity"] || "")')"
              if [ "${REGISTRY_INTEGRITY}" = "${LOCAL_INTEGRITY}" ]; then
                VERIFIED=true
                break
              fi
            fi
            sleep 5
          done
          test "${VERIFIED}" = true || {
            echo "Registry did not return the published tarball integrity in time." >&2
            exit 1
          }
          TAGGED_VERSION="$(npm view "${PACKAGE_NAME}" "dist-tags.${DIST_TAG}" --json | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)))')"
          test "${TAGGED_VERSION}" = "${PACKAGE_VERSION}" || {
            echo "Registry dist-tag ${DIST_TAG} points to ${TAGGED_VERSION}, not ${PACKAGE_VERSION}." >&2
            exit 1
          }
          echo "Published and verified ${PACKAGE_NAME}@${PACKAGE_VERSION} (${DIST_TAG})."
